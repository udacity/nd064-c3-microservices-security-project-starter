# Minimal RKE cluster.yaml without hardcoded image versions
nodes:
  - address: 192.168.2.155
    port: "22"
    internal_address: 192.168.2.155
    role:
      - controlplane
      - etcd
      - worker
    hostname_override: node1
    user: root
    docker_socket: /var/run/docker.sock
    ssh_key_path: ~/.ssh/id_rsa
    labels: {}
    taints: []

