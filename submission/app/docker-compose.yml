version: '3.3'

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.db
    ports:
      - 5432:5432
    networks:
      - secure_network
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpu_shares: 1024
    restart: on-failure
    read_only: true
    volumes:
      - ./data/postgres:/var/lib/postgresql/data:rw
    environment:
      - POSTGRES_DB=sqli
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=securepassword

  redis:
    image: redis:alpine
    networks:
      - secure_network
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpu_shares: 512
    restart: on-failure
    read_only: true

  sqli:
    build:
      context: .
      dockerfile: Dockerfile.app
    depends_on:
      - postgres
      - redis
    ports:
      - 8080:8080
    command: |
      wait-for postgres:5432 -- python run.py
    networks:
      - secure_network
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpu_shares: 1024
    restart: on-failure
    read_only: true
    environment:
      - DATABASE_URL=postgres://postgres:securepassword@postgres:5432/sqli

networks:
  secure_network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: "secure_network"
